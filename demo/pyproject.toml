[project]
name = "chronorepo-demo"
version = "1.0.0"
description = "Web demo for ChronoRepo (ICDM 2026): live repository indexing, temporal graph, impact set, issue -> files"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::SyntaxWarning", "ignore::DeprecationWarning"]
